name: Release Provider

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  test:
    name: Unit & Contract Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.7'
          cache: true

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.11.0'
          terraform_wrapper: false

      - name: Run Unit & Contract Tests
        run: go test -v -count=1 -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Reachable Vulnerability Check
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

      - name: Test Acceptance Report Evidence Contracts
        run: bash ./scripts/test_report_adversarial.sh

  race:
    name: Race Detector
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.7'
          cache: true

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.11.0'
          terraform_wrapper: false

      - name: Run Tests (with Race Detector)
        run: go test -v -race -count=1 ./...

  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.7'
          cache: true

      - name: Go Format Check
        run: test -z "$(gofmt -l .)" || (echo "Unformatted Go files found:" && gofmt -l . && exit 1)

      - name: Go Vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.1
          args: --timeout=5m ./...

      - name: Fetch All GitHub-Visible Refs for Secret Scanning
        run: |
          git fetch --force origin \
            '+refs/heads/*:refs/remotes/origin/*' \
            '+refs/tags/*:refs/tags/*' \
            '+refs/pull/*/head:refs/remotes/origin/pull/*'

      - name: Install Gitleaks 8.30.0
        run: |
          gitleaks_dir="${RUNNER_TEMP}/gitleaks-bin"
          bash ./scripts/install-gitleaks.sh "${gitleaks_dir}"
          echo "${gitleaks_dir}" >> "${GITHUB_PATH}"

      - name: Secret Scanning Check
        run: bash ./scripts/secret-scan.sh --all-refs

      - name: Verify Module Tidy & Dependencies
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
          go mod verify

  docs:
    name: Documentation Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.7'
          cache: true

      - name: Generate tfplugindocs & Check Diff
        run: |
          go run github.com/hashicorp/terraform-plugin-docs/cmd/tfplugindocs generate --provider-name namespace --rendered-provider-name "Namespace Cloud"
          git diff --exit-code docs/ || (echo "Generated documentation in docs/ is out of date. Run tfplugindocs generate." && exit 1)

      - name: Validate Documentation
        run: |
          go run github.com/hashicorp/terraform-plugin-docs/cmd/tfplugindocs validate --provider-name namespace

  examples:
    name: Terraform Examples Validation (${{ matrix.terraform_version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        terraform_version: ['1.11.0', 'latest']
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.7'
          cache: true

      - name: Set up Terraform (${{ matrix.terraform_version }})
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ matrix.terraform_version }}
          terraform_wrapper: false

      - name: Terraform Format Check
        run: terraform fmt -check -recursive .

      - name: Build Provider & Configure Filesystem Mirror
        run: |
          mkdir -p /tmp/mirror/registry.terraform.io/bsuv/namespace/0.1.0/linux_amd64
          CGO_ENABLED=0 go build -o /tmp/mirror/registry.terraform.io/bsuv/namespace/0.1.0/linux_amd64/terraform-provider-namespace_v0.1.0 .

          cat << 'EOF' > /tmp/mirror.tfrc
          provider_installation {
            filesystem_mirror {
              path    = "/tmp/mirror"
              include = ["*/*"]
            }
            direct {
              exclude = ["*/*"]
            }
          }
          EOF

      - name: Validate All Example Configurations
        run: |
          export TF_CLI_CONFIG_FILE=/tmp/mirror.tfrc
          FAILED=0
          for dir in examples/data-sources/* examples/ephemeral-resources/* examples/resources/* examples/provider; do
            if [ -d "$dir" ]; then
              echo "Validating $dir..."
              terraform -chdir="$dir" init -backend=false >/dev/null || { echo "Init failed for $dir"; FAILED=1; }
              terraform -chdir="$dir" validate || { echo "Validate failed for $dir"; FAILED=1; }
            fi
          done
          if [ $FAILED -ne 0 ]; then
            echo "One or more example configurations failed validation."
            exit 1
          fi
          echo "All example configurations validated successfully."

  acceptance:
    name: Acceptance Tests Gate (Live API)
    runs-on: ubuntu-latest
    environment: acceptance
    timeout-minutes: 120
    if: github.repository == 'bsuv/terraform-provider-namespace'
    concurrency:
      group: acceptance-singleton-guard
      cancel-in-progress: false
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.7'
          cache: true

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.11.0'
          terraform_wrapper: false

      - name: Run Acceptance Tests
        id: run-acceptance-tests
        env:
          TF_ACC: "1"
          NSC_RUN_ID: ${{ github.run_id }}-release
          NSC_TOKEN: ${{ secrets.NSC_TOKEN }}
          NSC_PARTNER_TOKEN: ${{ secrets.NSC_PARTNER_TOKEN }}
          NSC_TRUSTED_JWT: ${{ secrets.NSC_TRUSTED_JWT }}
          NSC_ENDPOINT: ${{ secrets.NSC_ENDPOINT }}
          NSC_TEST_TENANT: ${{ secrets.NSC_TEST_TENANT }}
          NSC_TEST_IMAGE_REPO: ${{ secrets.NSC_TEST_IMAGE_REPO }}
          NSC_TEST_IMAGE_DIGEST: ${{ secrets.NSC_TEST_IMAGE_DIGEST }}
          NSC_TEST_PAGINATED_IMAGE_REPO: ${{ secrets.NSC_TEST_PAGINATED_IMAGE_REPO }}
          NSC_TEST_CACHE_VOLUME_TAG: ${{ secrets.NSC_TEST_CACHE_VOLUME_TAG }}
          NSC_TEST_PV_TAG: ${{ secrets.NSC_TEST_PV_TAG }}
          NSC_TEST_VAULT_SECRET_ID: ${{ secrets.NSC_TEST_VAULT_SECRET_ID }}
        run: |
          mkdir -p test-reports-release
          go test -v -json -count=1 -timeout 120m ./internal/provider/... -run '^TestAcc' > "${RUNNER_TEMP:-/tmp}/test-release.json"

      - name: Generate Acceptance Test Report & JUnit Artifacts
        if: always()
        run: |
          bash ./scripts/generate-acceptance-report.sh \
            --input "${RUNNER_TEMP:-/tmp}/test-release.json" \
            --output-dir test-reports-release \
            --commit-sha "${{ github.sha }}" \
            --run-link "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --run-id "${{ github.run_id }}" \
            --tf-version "1.11.0" \
            --suite full
          cat test-reports-release/acceptance-report.md

      - name: Archive Acceptance Test Artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: acceptance-artifacts-release
          path: test-reports-release/
          retention-days: 14

      - name: Run Guarded Post-Test Sweeper
        if: always()
        env:
          TF_ACC: "1"
          NSC_RUN_ID: ${{ github.run_id }}-release
          NSC_TOKEN: ${{ secrets.NSC_TOKEN }}
          NSC_PARTNER_TOKEN: ${{ secrets.NSC_PARTNER_TOKEN }}
          NSC_TRUSTED_JWT: ${{ secrets.NSC_TRUSTED_JWT }}
          NSC_ENDPOINT: ${{ secrets.NSC_ENDPOINT }}
          NSC_TEST_TENANT: ${{ secrets.NSC_TEST_TENANT }}
          NSC_TEST_IMAGE_REPO: ${{ secrets.NSC_TEST_IMAGE_REPO }}
          NSC_TEST_IMAGE_DIGEST: ${{ secrets.NSC_TEST_IMAGE_DIGEST }}
          NSC_TEST_PAGINATED_IMAGE_REPO: ${{ secrets.NSC_TEST_PAGINATED_IMAGE_REPO }}
          NSC_TEST_CACHE_VOLUME_TAG: ${{ secrets.NSC_TEST_CACHE_VOLUME_TAG }}
          NSC_TEST_PV_TAG: ${{ secrets.NSC_TEST_PV_TAG }}
          NSC_TEST_VAULT_SECRET_ID: ${{ secrets.NSC_TEST_VAULT_SECRET_ID }}
        run: go test -v -count=1 -timeout 20m ./internal/provider/... -sweep=all

  release:
    name: Release via GoReleaser (Staged Draft & Pre-Publish Verification)
    needs: [test, race, lint, docs, examples, acceptance]
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify Tag and Commit Provenance
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          echo "==> Verifying semantic versioning format..."
          if [[ ! "${RELEASE_TAG}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Error: Release tag must be a v-prefixed semantic version, got: ${RELEASE_TAG}" >&2
            exit 1
          fi

          echo "==> Verifying annotated tag object..."
          TAG_TYPE="$(git cat-file -t "refs/tags/${RELEASE_TAG}" 2>/dev/null || git tag -l --format='%(objecttype)' "${RELEASE_TAG}")"
          if [ "${TAG_TYPE}" != "tag" ]; then
            echo "Error: Release tag '${RELEASE_TAG}' must be an annotated tag (got: ${TAG_TYPE:-unknown})" >&2
            exit 1
          fi

          echo "==> Verifying commit provenance..."
          test "$(git rev-parse HEAD)" = "${RELEASE_SHA}"
          test "$(git rev-list -n 1 "${RELEASE_TAG}")" = "${RELEASE_SHA}"

          echo "==> Verifying tag reachability from origin/main..."
          git fetch origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "${RELEASE_SHA}" origin/main; then
            echo "Error: Release commit ${RELEASE_SHA} is not reachable from origin/main!" >&2
            exit 1
          fi
          echo "    Tag provenance and reachability verified successfully."

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.7'
          cache: true

      - name: Import GPG Key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}

      - name: Verify Terraform Registry-Compatible Signing Key
        env:
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          REGISTERED_GPG_FINGERPRINT: ${{ secrets.GPG_FINGERPRINT }}
        run: |
          NORMALIZED_IMPORTED="$(printf '%s' "${GPG_FINGERPRINT}" | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')"
          NORMALIZED_REGISTERED="$(printf '%s' "${REGISTERED_GPG_FINGERPRINT}" | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')"
          if [[ ! "${NORMALIZED_REGISTERED}" =~ ^[0-9A-F]{40}$ ]] || [[ "${NORMALIZED_IMPORTED}" != "${NORMALIZED_REGISTERED}" ]]; then
            echo "Imported signing key does not match the 40-character GPG fingerprint registered for this release." >&2
            exit 1
          fi
          KEY_ALGORITHM="$(gpg --batch --with-colons --list-secret-keys "${GPG_FINGERPRINT}" | awk -F: '$1 == "sec" { print $4; exit }')"
          case "${KEY_ALGORITHM}" in
            1|3|17) ;;
            *)
              echo "Terraform Registry requires an RSA or DSA primary signing key; GPG algorithm ${KEY_ALGORITHM:-unknown} is unsupported." >&2
              exit 1
              ;;
          esac

      - name: Build & Stage Release via GoReleaser (Draft Mode)
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: 'v2.17.1'
          args: release --clean --draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.11.0'
          terraform_wrapper: false

      - name: Download Staged Release Artifacts
        run: |
          mkdir -p staged-dist
          gh release download "${{ github.ref_name }}" --dir staged-dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate Staged Release Artifacts (Smoke Test)
        run: ./scripts/smoke-test.sh --dist-dir staged-dist

      - name: Download Sanitized Acceptance Evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: acceptance-artifacts-release
          path: staged-evidence

      - name: Attach Acceptance Evidence to Draft Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            staged-evidence/acceptance-report.md \
            staged-evidence/junit.xml \
            staged-evidence/sanitized-acceptance.log

      - name: Promote & Publish GitHub Release
        run: gh release edit "${{ github.ref_name }}" --draft=false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
