version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    # The Buf-generated Namespace Cloud modules (grpc/go and protocolbuffers/go)
    # are tightly coupled to each other and should be updated together.
    groups:
      namespace-cloud-sdk:
        patterns:
          - "buf.build/gen/go/namespace/*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
